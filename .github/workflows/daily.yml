name: daily-forecast
on:
  schedule:           # UTC. GitHub often starts scheduled jobs several hours late, so these are early on purpose.
    - cron: "30 8 * * *"
    - cron: "0 11 * * *"
    - cron: "30 13 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:   # lets you start it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-job.txt
      - run: pip install -r requirements-job.txt
      - run: python run_daily.py
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -A forecasts scoreboard.csv history logs
          if ! git diff --staged --quiet; then
            git commit -m "Daily forecast $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
